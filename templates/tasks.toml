# Operator-global tasks configuration. Copy to ~/.config/tasks/config.toml
# (or point $TASKS_CONFIG at it). Backend choice and the repository
# portfolio are operator facts at machine scope; they never live in a
# repository.

[backend]
provider = "local"            # or "linear"; `tasks backends` lists what is installed
# path = "~/.local/state/tasks/tasks.json"   # local: where the file lives
# team = "ENG"                # linear: team key (required when the key sees several)
# api_key_env = "LINEAR_API_KEY"             # linear: environment variable holding the key, or
# api_key_command = "security find-generic-password -w -s linear-api-key"   # a command that prints it

# One entry per portfolio repository. The description is what lets an
# agent assign a task to the right repository instead of guessing from the
# name; the path maps a checkout to that name.
# [repos.example]
# description = "One line saying what this repository is and owns"
# path = "~/source/example"
