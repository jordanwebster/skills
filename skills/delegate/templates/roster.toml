# Operator-owned roster: role -> binding. Copy to ~/.config/delegate/roster.toml
# (or point $DELEGATE_ROSTER at it). Agents may propose edits as rows for your
# explicit yes; only you write this file.
#
# Each binding names the mind (family, model, effort) and its fallback CLI.
# Family is inferred from claude/codex CLI names; set `family` for another
# adapter. `effort_arg` may record the exact effort flag template and an inline
# `constraints` table may record approval-relevant limits such as sandbox or
# authority.
#
# `delegate resolve` constructs fallback argv. `delegate doctor` checks the
# roster, command shape, and executable locally without launching a provider.
# The first real dispatch is the connectivity and authentication check. A role
# absent from this file is an error, never a silent substitution. To park a role
# explicitly, replace its binding with `unavailable = "reason"`.
#
# There is deliberately no oracle or answer-key role: verification authority
# is the operator's personally and is not a staffing question.

[planner]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"

[implementer]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"

[prober]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "sonnet"
effort = "medium"

[reviewer]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"

[reviewer-cross-family]
cli = "codex"
args = ["exec", "--sandbox", "read-only"]
model = "gpt-5.6-sol"
effort = "high"
effort_arg = "-c model_reasoning_effort=<effort>"
# Cross-family checks require a family other than the author's; this
# binding satisfies that when the author is claude. Adjust the model to
# whatever your codex install runs.

[closer]
cli = "codex"
args = ["exec", "--sandbox", "workspace-write"]
model = "gpt-5.6-sol"
effort = "high"
effort_arg = "-c model_reasoning_effort=<effort>"
# Acceptance against the requirements, by a family other than the
# implementer's when the roster can arrange it.

[ui-developer]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"
# Family constraint recorded here by the operator's observation: claude
# outperforms codex on UI work.

[qa-tester]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "haiku"
effort = "low"
# Cheap on purpose: naive usage finds what a human would hit.
