# Operator-owned roster: role -> binding. Copy to ~/.config/delegate/roster.toml
# (or point $DELEGATE_ROSTER at it). Agents may propose edits as rows for your
# explicit yes; only you write this file.
#
# Each binding names the mind: family (via cli), model, and optionally
# effort. `effort_arg` optionally records the exact flag or config key the
# CLI accepts effort through, so dispatchers need no per-CLI knowledge.
# The cli/args lines are the fallback transport — a dispatcher
# running inside a harness of the same family uses its native subagents
# instead, and a shared agent bus (amux) takes over when configured.
# An unattended driver always uses cli/args: put the flags an unattended
# run needs there (claude: a permission mode; codex: a sandbox mode).
# A role the roster does not name is an error at dispatch, never a silent
# substitution; `autopilot preflight` checks every role a plan uses, that
# each CLI is installed, and that each binding actually launches.
#
# There is deliberately no oracle or answer-key role: verification authority
# is the operator's personally and is not a staffing question.

[planner]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"

[implementer]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"

[prober]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "sonnet"
effort = "medium"

[reviewer]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"

[reviewer-cross-family]
cli = "codex"
args = ["exec", "--sandbox", "read-only"]
model = "gpt-5.6-sol"
effort = "high"
effort_arg = "-c model_reasoning_effort=<effort>"
# Cross-family checks require a family other than the author's; this
# binding satisfies that when the author is claude. Adjust the model to
# whatever your codex install runs.

[closer]
cli = "codex"
args = ["exec", "--sandbox", "workspace-write"]
model = "gpt-5.6-sol"
effort = "high"
effort_arg = "-c model_reasoning_effort=<effort>"
# Acceptance against the requirements, by a family other than the
# implementer's when the roster can arrange it.

[ui-developer]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "opus"
effort = "high"
# Family constraint recorded here by the operator's observation: claude
# outperforms codex on UI work.

[qa-tester]
cli = "claude"
args = ["-p", "--permission-mode", "auto"]
model = "haiku"
effort = "low"
# Cheap on purpose: naive usage finds what a human would hit.
